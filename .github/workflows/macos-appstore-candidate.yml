name: macOS App Store Candidate Validation

on:
  push:
    branches:
      - feature/macos-app-store-sandbox-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Sandbox candidate ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-14-large
            port: 4584
          - arch: arm64
            runner: macos-14-xlarge
            port: 4585
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and runner
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sw_vers
          uname -m
      - name: Stage Mac app without a release DMG
        shell: bash
        run: bash scripts/build-macos-package.sh --arch '${{ matrix.arch }}' --version 0.1.0-beta.27 --stage-only
      - name: Apply validation-only ad-hoc sandbox signature
        shell: bash
        run: python3 scripts/sign-macos-appstore-candidate.py '.dist/macos-${{ matrix.arch }}/stage/Certifyd Core.app'
      - name: Check sandbox entitlements and local runtime
        shell: bash
        run: |
          set -euo pipefail
          app='.dist/macos-${{ matrix.arch }}/stage/Certifyd Core.app'
          python3 - "$app" <<'PY'
          import plistlib, subprocess, sys
          app = sys.argv[1]
          xml = subprocess.check_output(["codesign", "-d", "--entitlements", ":-", app], stderr=subprocess.DEVNULL)
          rights = plistlib.loads(xml)
          assert rights.get("com.apple.security.app-sandbox") is True, rights
          assert rights.get("com.apple.security.network.client") is True, rights
          assert rights.get("com.apple.security.network.server") is True, rights
          print("Sandbox and network entitlements: PASS")
          PY
          bash scripts/validate-macos-appstore-candidate.sh '${{ matrix.arch }}' '${{ matrix.port }}'
      - name: Package validation-only app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ".dist/macos-${{ matrix.arch }}/candidate"
          candidate_dir=".dist/macos-${{ matrix.arch }}/candidate"
          archive="Certifyd-Core-AppStore-CANDIDATE-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent ".dist/macos-${{ matrix.arch }}/stage/Certifyd Core.app" "$candidate_dir/$archive"
          (cd "$candidate_dir" && shasum -a 256 "$archive" > "$archive.sha256")
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "architecture=${{ matrix.arch }}"
            echo "signing=ad-hoc; not valid for App Store submission"
            echo "validation=local sandbox startup, restart, key persistence, outside write denial, private interface health"
          } > ".dist/macos-${{ matrix.arch }}/candidate/BUILD.txt"
      - name: Upload validation-only app
        uses: actions/upload-artifact@v4
        with:
          name: appstore-validation-only-${{ matrix.arch }}
          path: .dist/macos-${{ matrix.arch }}/candidate/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload failure logs only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appstore-candidate-logs-${{ matrix.arch }}
          path: ~/Library/Containers/me.certifyd.core/Data/Library/Application Support/ContentBox/logs/*.log
          if-no-files-found: ignore
