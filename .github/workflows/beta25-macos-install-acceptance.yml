name: Beta 25 macOS install acceptance

on:
  workflow_dispatch:
  push:
    branches: [feat/macos-developer-id-notarization]

permissions:
  contents: read
  actions: read

jobs:
  install-and-launch:
    if: github.repository == 'BEATiFYAUDIO/contentbox' && github.ref == 'refs/heads/feat/macos-developer-id-notarization'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-14-large
            sha256: 0e6738a595d9828dd43d7f25b2cf5d5adad54795185f45c394b45a194499d835
          - arch: arm64
            runner: macos-14-xlarge
            sha256: b70e315bae9c1a99e0e0214de2dddfcc53611504bd92ff0a726c70afb9325755
    steps:
      - name: Download exact signed DMG from the successful signing run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: 40261699071
          github-token: ${{ github.token }}
          name: certifyd-core-signed-macos-${{ matrix.arch }}-0.1.0-beta.25
          path: signed

      - name: Install quarantined app and launch through macOS
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          dmg="signed/Certifyd-Core-0.1.0-beta.25-macos-$ARCH.dmg"
          app="/Applications/Certifyd Core.app"
          mount_dir="$(mktemp -d)"
          cleanup() {
            "$app/Contents/Resources/stop.sh" || true
            launchctl unsetenv CI || true
            hdiutil detach "$mount_dir" -quiet || true
          }
          trap cleanup EXIT

          test "$(shasum -a 256 "$dmg" | awk '{print $1}')" = "$EXPECTED_SHA256"
          xattr -w com.apple.quarantine '0083;00000000;Safari;' "$dmg"
          test -n "$(xattr -p com.apple.quarantine "$dmg")"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          xcrun stapler validate "$dmg"

          hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -readonly
          osascript - "$mount_dir/Certifyd Core.app" <<'APPLESCRIPT'
          on run argv
            set sourceApp to POSIX file (item 1 of argv) as alias
            tell application "Finder"
              duplicate sourceApp to (path to applications folder) with replacing
            end tell
          end run
          APPLESCRIPT
          test -n "$(xattr -p com.apple.quarantine "$app")"
          spctl --assess --type execute --verbose=4 "$app"
          codesign --verify --deep --strict --all-architectures "$app"
          launchctl setenv CI 1
          open "$app" > "$RUNNER_TEMP/certifyd-open.log" 2>&1 &
          open_pid=$!
          echo "Launch Services open PID: $open_pid"

          health=000
          for _ in $(seq 1 90); do
            health="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:4000/health || true)"
            test "$health" = 200 && break
            sleep 2
          done
          if [[ "$health" != 200 ]]; then
            cat "$RUNNER_TEMP/certifyd-open.log" || true
            pgrep -fl 'Certifyd|open' || true
            find "$HOME/Library/Application Support/ContentBox/logs" -maxdepth 1 -type f -print -exec tail -n 30 {} \; 2>/dev/null || true
            exit 1
          fi
          test "$health" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:4000/)" = 200
          "$app/Contents/Resources/status.sh"
          {
            echo "### $ARCH signed DMG installation"
            echo "Signing run: 40261699071"
            echo "SHA-256: $EXPECTED_SHA256"
            echo "Quarantine, Gatekeeper, stapled ticket, Finder installation, Launch Services CI-mode start, health, dashboard: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
