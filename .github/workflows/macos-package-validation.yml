name: macOS Package Validation

on:
  workflow_dispatch:
    inputs:
      version:
        description: Certifyd Core package version to build
        required: true
        default: 0.1.0-beta.11
      source_ref:
        description: Exact source commit SHA (empty uses this workflow commit)
        required: false
  push:
    branches:
      - "temp/macos-package-validation-*"
      - "temp/release-assembly-*"

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.1.0-beta.11' }}
  RELEASE_SOURCE_REF: ${{ inputs.source_ref || github.sha }}

jobs:
  build-and-validate:
    name: Build and validate macOS ${{ matrix.arch }} package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-14-large
            port: 4580
          - arch: arm64
            runner: macos-14-xlarge
            port: 4581

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "RELEASE_SOURCE_COMMIT=$actual" >> "$GITHUB_ENV"
          {
            echo "## Release source"
            echo "Requested source=${RELEASE_SOURCE_REF}"
            echo "Checked out source=$actual"
            echo "Version=${RELEASE_VERSION}"
          } | tee -a "macos-${{ matrix.arch }}-validation-summary.md"
          if [ "$actual" != "$RELEASE_SOURCE_REF" ]; then
            echo "Source mismatch" >&2
            echo "Expected: $RELEASE_SOURCE_REF" >&2
            echo "Actual:   $actual" >&2
            exit 1
          fi

      - name: Record macOS runner environment
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## macOS runner environment"
            sw_vers
            uname -a
            echo "machine=$(uname -m)"
            echo "runner=${{ matrix.runner }}"
          } | tee -a "macos-${{ matrix.arch }}-validation-summary.md"

      - name: Build macOS package
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-macos-package.sh --arch "${{ matrix.arch }}" --version "$RELEASE_VERSION"

      - name: Inspect packaged output
        shell: bash
        run: |
          set -euo pipefail
          expected=".dist/macos-${{ matrix.arch }}/package/Certifyd-Core-${RELEASE_VERSION}-macos-${{ matrix.arch }}.dmg"
          dmg="$(find ".dist/macos-${{ matrix.arch }}/package" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          test "$dmg" = "$expected"
          size="$(stat -f '%z' "$dmg")"
          hash="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          {
            echo "DMG_PATH=$dmg"
            echo "DMG_NAME=$(basename "$dmg")"
            echo "DMG_SIZE=$size"
            echo "DMG_SHA256=$hash"
          } >> "$GITHUB_ENV"
          {
            echo "## Packaged output"
            echo "DMG=$(basename "$dmg")"
            echo "DMG size=$size"
            echo "SHA-256=$hash"
            echo "Source commit=$RELEASE_SOURCE_COMMIT"
          } | tee -a "macos-${{ matrix.arch }}-validation-summary.md"

      - name: Mount DMG and validate runtime
        shell: bash
        run: bash scripts/validate-macos-runtime.sh "$DMG_PATH" "${{ matrix.arch }}" "${{ matrix.port }}" "$RELEASE_VERSION" unsigned

      - name: Upload macOS package artifact
        uses: actions/upload-artifact@v4
        with:
          name: certifyd-core-macos-${{ matrix.arch }}-${{ env.RELEASE_VERSION }}
          path: |
            .dist/macos-${{ matrix.arch }}/package/*.dmg
            .dist/macos-${{ matrix.arch }}/package/*.sha256
            macos-${{ matrix.arch }}-validation-summary.md
          if-no-files-found: error
