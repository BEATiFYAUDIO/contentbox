name: Temporary Safari Extension Signing

on:
  workflow_dispatch:
    inputs:
      version:
        description: Safari extension version
        required: true
        type: string
      bundle_build:
        description: Safari CFBundleVersion from the unsigned build
        required: true
        type: string
      handoff_tag:
        description: Draft release tag containing the unsigned input
        required: true
        type: string
      handoff_asset:
        description: Unsigned handoff asset filename
        required: true
        type: string
      handoff_sha256:
        description: Required SHA-256 for the unsigned handoff
        required: true
        type: string
      extension_source_sha:
        description: Exact validated extension source commit
        required: true
        type: string
      environment_protection_confirmed:
        description: Confirm macos-release protections and this one-time Safari signing operation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sign-safari:
    if: inputs.environment_protection_confirmed && github.repository == 'BEATiFYAUDIO/contentbox' && github.ref == 'refs/heads/feat/macos-developer-id-notarization'
    environment: macos-release
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Download and verify unsigned handoff
        env:
          HANDOFF_TAG: ${{ inputs.handoff_tag }}
          HANDOFF_ASSET: ${{ inputs.handoff_asset }}
          HANDOFF_SHA256: ${{ inputs.handoff_sha256 }}
          EXPECTED_SOURCE: ${{ inputs.extension_source_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/handoff" "$RUNNER_TEMP/unpacked"
          gh release download "$HANDOFF_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$HANDOFF_ASSET" --dir "$RUNNER_TEMP/handoff"
          asset="$RUNNER_TEMP/handoff/$HANDOFF_ASSET"
          printf '%s  %s\n' "$HANDOFF_SHA256" "$asset" | shasum -a 256 -c -
          tar -C "$RUNNER_TEMP/unpacked" -xzf "$asset"
          test "$(cat "$RUNNER_TEMP/unpacked/SOURCE_COMMIT")" = "$EXPECTED_SOURCE"
          git clone "$RUNNER_TEMP/unpacked/source.bundle" "$RUNNER_TEMP/extension-source"
          test "$(git -C "$RUNNER_TEMP/extension-source" rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git -C "$RUNNER_TEMP/extension-source" diff --exit-code
          test -d "$RUNNER_TEMP/unpacked/Certifyd.app"
          test -d "$RUNNER_TEMP/unpacked/entitlements"

      - name: Sign, notarize, staple, and validate Safari
        id: signed
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/extension-source"
          bash tools/sign-safari-release.sh "$RUNNER_TEMP/unpacked/Certifyd.app" "${{ inputs.version }}" "${{ inputs.bundle_build }}" "$RUNNER_TEMP/unpacked/entitlements"

      - name: Remove temporary signing material
        if: always()
        run: |
          set -euo pipefail
          if [[ -x "$RUNNER_TEMP/extension-source/tools/sign-safari-release.sh" ]]; then
            bash "$RUNNER_TEMP/extension-source/tools/sign-safari-release.sh" --cleanup
          fi

      - name: Verify final signed artifact checksum
        env:
          DMG: ${{ steps.signed.outputs.dmg_path }}
        run: |
          set -euo pipefail
          test -f "$DMG"
          shasum -a 256 "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          {
            echo '## Certifyd Safari protected signing'
            echo "Extension source: ${{ inputs.extension_source_sha }}"
            echo "Unsigned handoff SHA-256: ${{ inputs.handoff_sha256 }}"
            cat "$RUNNER_TEMP/certifyd-safari-diagnostics/provenance.txt"
            cat "$RUNNER_TEMP/certifyd-safari-diagnostics/SHA256SUMS.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed Safari DMG and diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Certifyd-Extension-${{ inputs.version }}-Safari-protected-signed
          path: |
            ${{ steps.signed.outputs.dmg_path }}
            ${{ runner.temp }}/certifyd-safari-diagnostics/
          if-no-files-found: error
          retention-days: 14
