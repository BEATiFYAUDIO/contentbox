version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: contentbox_postgres
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      POSTGRES_DB: contentbox
      POSTGRES_USER: ${CONTENTBOX_POSTGRES_USER:-contentbox}
      POSTGRES_PASSWORD: ${CONTENTBOX_POSTGRES_PASSWORD:?Set CONTENTBOX_POSTGRES_PASSWORD in infra/.env before starting Postgres}
    ports:
      - "127.0.0.1:${CONTENTBOX_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: contentbox_minio
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      MINIO_ROOT_USER: ${CONTENTBOX_MINIO_ROOT_USER:?Set CONTENTBOX_MINIO_ROOT_USER in infra/.env before starting MinIO}
      MINIO_ROOT_PASSWORD: ${CONTENTBOX_MINIO_ROOT_PASSWORD:?Set CONTENTBOX_MINIO_ROOT_PASSWORD in infra/.env before starting MinIO}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${CONTENTBOX_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${CONTENTBOX_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
